[project]
name = "vantage-api"
version = "0.1.0"
description = "Vantage CRM backend API"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",          # async driver — application runtime
    "psycopg[binary]>=3.2.0",   # sync driver — Alembic migrations only
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "uuid6>=2024.7.10",
    "boto3>=1.35.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "testcontainers[postgres]>=4.9.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pip-audit>=2.7.3",
    "types-boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports
    "S",         # bandit — security
    "ASYNC",     # async correctness
    "RUF",
]
ignore = [
    "S101",   # assert — permitted in tests
    "B008",   # function call in default arg — this is how FastAPI Depends works
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]           # hardcoded test credentials are fine
"alembic/versions/*" = ["E501", "N999", "S608"]  # generated migrations; SQL is
                                                  # built from module constants,
                                                  # never from user input

# Constant names like PASSWORD_CHANGED / TOKEN_REFRESHED trip the hardcoded-
# password heuristic. They are audit action identifiers, not credentials.
"app/core/audit_actions.py" = ["S105"]

# This module is nothing but DDL constants.
#   S105 — flags `TOKEN_LOOKUP_FUNCTION` as a hardcoded password because of the
#          name; it holds a CREATE FUNCTION statement.
#   S608 — flags f-strings in SQL; every interpolated value is a module-level
#          role-name constant, never user input. Identifiers cannot be bound as
#          parameters in PostgreSQL DDL, so interpolation is the only option.
"app/db/sql_objects.py" = ["S105", "S608"]

[tool.ruff.lint.isort]
# Without this, `app` is treated as a third-party package and import blocks get
# reordered into a misleading grouping.
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports]
# Enforces the layering rule from docs/ARCHITECTURE.md §4.1:
#   api -> services -> repositories -> models
# Routers must never reach past services into the ORM.
ban-relative-imports = "all"

# ---------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `@computed_field` stacked on `@property` is the documented Pydantic v2 idiom,
# but mypy does not model decorators above `property`. Known limitation, not a
# defect in the code.
module = "app.core.config"
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
# redis-py does not ship complete annotations for `from_url`.
module = "app.core.redis"
disable_error_code = ["no-untyped-call"]

# -------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires live PostgreSQL via testcontainers",
]
