# Production overlay for a single VPS (Hetzner/Vultr/DigitalOcean + Docker).
#
# Use ON TOP of the base compose, from the repo root:
#
#   docker compose -f docker-compose.yml -f deploy/compose/docker-compose.prod.yml \
#     --env-file .env up -d --build
#
# What it changes vs the local stack:
#   * Adds Caddy on 80/443 as the only public entrypoint, with automatic HTTPS
#     (Let's Encrypt) for the app domain and the file (S3) subdomain.
#   * Stops publishing web:3000 to the host — Caddy reaches it over the compose
#     network, so nothing but 80/443 is exposed. (`!reset` clears the base
#     port list; requires Docker Compose v2.24+, which the target hosts have.)
#   * Postgres/Redis/MinIO already bind to 127.0.0.1 in the base file, so they
#     stay off the public interface.
#
# DNS: point both `${DOMAIN}` and `files.${DOMAIN}` A-records at the VPS IP.
# Presigned upload/download URLs are issued for https://files.${DOMAIN}
# (S3_PUBLIC_ENDPOINT_URL), which Caddy proxies to MinIO.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - minio

  web:
    # Not published to the host in production — Caddy fronts it.
    ports: !reset []
    expose:
      - "3000"

  # Real malware scanning for uploaded files. Production only: the engine holds
  # its signature database in memory (~1 GB) and re-downloads it daily, which is
  # not a cost a laptop should pay to run the test suite.
  #
  # The API refuses to boot production with scanning enabled and the EICAR test
  # scanner configured, so turning `MALWARE_SCAN_ENABLED` on without this
  # service — or with `MALWARE_SCANNER=eicar` — fails loudly instead of quietly
  # passing every file.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    environment:
      # Signature updates run inside the container; without them the engine is
      # a month behind within a month.
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      # Survives restarts, so a redeploy does not re-download the whole
      # database and leave uploads unscannable while it does.
      - clamav_data:/var/lib/clamav
    healthcheck:
      # `PING` answers only once the database is loaded, which takes minutes on
      # first boot. Dependants wait for that rather than for the process.
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m

volumes:
  caddy_data:
  caddy_config:
  clamav_data:
